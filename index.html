<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RDVault</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1 class="centered">RDVault</h1>
  </header>

  <section class="form-section">
    <h2>Form Pemesanan</h2>
    <form id="order-form">
      <label for="category">Kategori:</label>
      <select id="category" required>
        <option value="">-- Pilih Kategori --</option>
        <option value="Topup ML">Topup ML</option>
        <option value="Topup FF">Topup FF</option>
        <option value="Joki MLBB">Joki MLBB</option>
      </select>

      <div id="ml-extra" style="display:none;">
        <label for="game-id">ID Game (ML):</label>
        <input type="text" id="game-id" placeholder="Contoh: 12345678" />
        <label for="server-id">Server ID:</label>
        <input type="text" id="server-id" placeholder="Contoh: 1234" />
      </div>

      <label for="buyer">Nama Pembeli:</label>
      <input type="text" id="buyer" required />

      <label for="product">Pilih Produk:</label>
      <select id="product" required></select>

      <label for="payment">Metode Pembayaran:</label>
      <select id="payment" required>
        <option value="cash">Cash (dengan kode rahasia)</option>
        <option value="transfer">Transfer BCA (via WhatsApp)</option>
      </select>

      <p id="total-harga">Total Harga: Rp 0</p>
      <button type="submit">Pesan Sekarang</button>
    </form>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="script.js"></script>
</body>
</html>
