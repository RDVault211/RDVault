<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vault</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <img src="logo.png" alt="Vault Logo" class="logo" />
  </header>

  <main>
    <section id="order-section">
      <h2>Pesan Produk</h2>
      <form id="order-form">
        <select id="order-category" required></select>
        <select id="product" required></select>
        <div id="label-server" class="hidden">
          <input type="text" id="server_id" placeholder="Server ID" />
        </div>
        <input type="text" id="id_game" placeholder="ID Game" required />
        <input type="text" id="buyer_name" placeholder="Nama Pembeli" required />
        <input type="number" id="quantity" value="1" min="1" required />
        <select id="payment_method" required>
          <option disabled selected>Pilih metode</option>
          <option value="cash">Cash (Kode)</option>
          <option value="transfer">Transfer</option>
        </select>
        <input type="text" id="secret" placeholder="Kode Rahasia" class="hidden" />
        <p id="total-price">Total: Rp 0</p>
        <button type="submit">Pesan Sekarang</button>
      </form>
      <div id="product-list"></div>
    </section>

    <section id="auth-section">
      <h2>Login Admin</h2>
      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="password" placeholder="Password" />
      <button id="login-btn">Login</button>
    </section>

    <section id="admin-panel" class="hidden">
      <h2>Admin Panel</h2>
      <button id="logout-btn">Logout</button>
      <h3>Tambah Produk</h3>
      <input type="text" id="new-name" placeholder="Nama Produk" />
      <input type="number" id="new-price" placeholder="Harga" />
      <input type="text" id="new-category" placeholder="Kategori" />
      <button id="add-product-btn">Tambah Produk</button>

      <h3>Daftar Produk</h3>
      <div id="admin-products"></div>

      <h3>Pesanan Cash</h3>
      <ul id="orders-cash"></ul>
      <h3>Pesanan Transfer</h3>
      <ul id="orders-transfer"></ul>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
