<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TopUp Otomatis</title>
  <link rel="icon" type="image/png" href="logo.png">
  <script type="module" src="main.js" defer></script>
  <link href="style.css" rel="stylesheet" />
</head>
<body class="bg-gray-900 text-white">
  <div class="max-w-2xl mx-auto p-4">
    <img src="logo.png" alt="Logo" class="mx-auto w-32 mb-4">
    <h1 class="text-2xl text-center font-bold mb-4">TopUp Otomatis</h1>

    <select id="category-filter" class="w-full mb-2 p-2 rounded text-black"></select>
    <button id="toggle-products" class="w-full mb-2 bg-blue-600 hover:bg-blue-700 text-white p-2 rounded">Tampilkan/Sembunyikan Daftar Produk</button>
    <h3 id="current-category" class="text-lg font-semibold mb-2"></h3>
    <div id="product-list" class="grid grid-cols-2 gap-4 mb-6"></div>

    <form id="order-form" class="bg-gray-800 p-4 rounded space-y-4">
      <input id="buyer_name" placeholder="Nama Pembeli" class="w-full p-2 rounded text-black" required />
      <input id="id_game" placeholder="ID Game" class="w-full p-2 rounded text-black" required />

      <div id="server-box" class="hidden">
        <input id="server_id" placeholder="Server ID" class="w-full p-2 rounded text-black" />
      </div>

      <select id="order-category" class="w-full p-2 rounded text-black" required></select>
      <select id="product" class="w-full p-2 rounded text-black" required></select>

      <div id="quantity-box" class="hidden">
        <input id="quantity" type="number" value="1" min="1" class="w-full p-2 rounded text-black" />
      </div>

      <select id="payment_method" class="w-full p-2 rounded text-black" required>
        <option disabled selected>Pilih Metode Pembayaran</option>
        <option value="cash">Cash (Kode Rahasia)</option>
        <option value="transfer">Transfer BCA (via WhatsApp)</option>
      </select>

      <input id="secret" placeholder="Kode Rahasia" class="w-full p-2 rounded text-black" />
      <div id="total-price" class="text-xl font-semibold"></div>
      <button type="submit" class="w-full bg-green-600 hover:bg-green-700 p-2 rounded text-white">Kirim Pesanan</button>
    </form>
  </div>
</body>
</html>
